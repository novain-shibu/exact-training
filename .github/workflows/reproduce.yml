# Runs reproduce.py on several CPU vendors / architectures (GitHub-hosted runners, free for public repos).
# Each job prints its CPU and must print MATCH (exact hash ced279b58bc72962); float32 hashes are expected to differ.
name: reproduce-on-many-cpus
on:
  workflow_dispatch:
  push:
    paths: ["reproduce.py", "xtrain.py", ".github/workflows/reproduce.yml"]
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy
      - name: CPU and versions
        shell: bash
        run: |
          python -c "import platform, sys, numpy; print(platform.platform(), platform.machine(), platform.processor(), sys.version.split()[0], 'numpy', numpy.__version__)"
          (lscpu 2>/dev/null | grep -E 'Model name|Vendor ID|Architecture') || (sysctl -n machdep.cpu.brand_string 2>/dev/null) || (powershell -c "(Get-CimInstance Win32_Processor).Name") || true
      - name: Reproduce
        shell: bash
        run: |
          python reproduce.py | tee out.txt
          grep -q "): MATCH" out.txt
